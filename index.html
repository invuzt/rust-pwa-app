<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rust PWA App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <h1 id="status">Menunggu Rust...</h1>
    
<script type="module">
  // Sesuaikan nama file .js dengan nama package di Cargo.toml
  import init from './pkg/rust_pwa_app.js'; 
  
  async function run() {
      try {
          await init();
          console.log("Rust Loaded!");
      } catch (err) {
          console.error("Gagal load Rust:", err);
      }
  }
  run();
</script>


  </body>
</html>
